<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="/favicon.png" />
  <title id="t">Home</title>
  <link rel="stylesheet" href="/assets/css/global.css?v=2026-09-15-3" />
  <link rel="stylesheet" href="/assets/css/t.css?v=2026-09-15-3" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--background-color:#222;--text-primary:#fff;--background-settings:#2a2a2a;--tab-active-background:#444;--background-input:#4545459e;--text-placeholder:#aaa}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background-color);color:var(--text-primary);font-family:Inter,Poppins,Arial,sans-serif}
    .nav{padding:1rem;width:100vw;height:.5vw;display:flex;align-items:center;box-sizing:border-box}
    .nav-bar{position:fixed;left:0;right:0;top:0;height:2.5em;padding:0 25px;background:var(--background-color);box-sizing:border-box;z-index:100;width:100vw}
    .nav-container{width:100%;height:100%;display:block}
    .nav-left{position:absolute;top:50%;transform:translateY(-50%);left:1%;width:80%;display:flex;align-items:center}
    .nav-right{position:absolute;top:50%;transform:translateY(-50%);right:1%;width:20%;display:flex;justify-content:flex-end;align-items:center}
    .nav-button{border-radius:10px;color:var(--text-primary);background:none;height:3em;border:none;box-sizing:border-box;margin:0 10px 0 0;cursor:pointer}
    .bar{background:none;border:none;color:var(--text-primary);width:60vw;height:30px;border-radius:5px;margin:0 auto}
    .bar:focus{background:var(--background-input);outline:none;color:var(--text-primary)}
    .navpost{padding:0;float:none;margin:0;color:var(--text-primary);border-radius:5px}
    .frame-container iframe{display:none;position:absolute;width:100%;height:90%;border:none;left:0;top:10%}
    .frame-container iframe.active{display:block}
    #tab-list{list-style:none;padding:0;margin:0;display:flex}
    #tab-list li{padding:.4rem;background:var(--background-settings);margin-right:.5rem;cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center}
    #tab-list li.active{background:var(--tab-active-background)}
    #add-tab{padding:.5rem;cursor:pointer;background:var(--background-settings);color:var(--text-primary);border:none;border-radius:5px;margin-right:.5rem}
    .close-tab{border:none;background:none;font-size:12px;color:var(--text-primary);cursor:pointer;width:20px}
  </style>
  <script>
    if (navigator.keyboard?.lock) {
      window.addEventListener("resize", () => navigator.keyboard.lock(["Escape"]));
    }
  </script>
</head>
<body id="no">
  <nav class="nav" id="right-side-nav">
    <ul id="tab-list"></ul>
    <button title="add-tab" id="add-tab"><i class="fa-solid fa-plus"></i></button>
  </nav>
  <div class="nav-bar">
    <div class="nav-container">
      <div class="nav-left">
        <button title="Home Page" id="home-page" class="nav-button" onclick="Home()"><i class="fa-solid fa-house"></i></button>
        <button title="Back Arrow" class="nav-button" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <button title="Forward Arrow" class="nav-button" onclick="goForward()"><i class="fa-solid fa-arrow-right"></i></button>
        <button title="Reload" onclick="reload()" class="nav-button"><i class="fa-solid fa-rotate-right"></i></button>
        <form id="fv" class="navpost" method="POST"><input id="input" class="bar" placeholder="Search or enter a new URL" type="text" /></form>
      </div>
      <div class="nav-right">
        <button title="Fullscreen" id="fullscreen-button" class="nav-button nav-btn-right" onclick="FS()"><i class="fa-solid fa-expand"></i></button>
        <button title="Window Popout" id="popout-button" class="nav-button nav-btn-right" onclick="popout()"><i class="fa-solid fa-up-right-from-square"></i></button>
        <button title="Inspect" class="nav-button nav-btn-right" onclick="eToggle()"><i class="fa-solid fa-code"></i></button>
        <button title="Tabs" id="tabs-button" class="nav-button nav-btn-right"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      </div>
    </div>
  </div>
  <div class="frame-container" id="frame-container"></div>
  <script src="/assets/js/t3.js?v=2026-09-17-8"></script>
  <script src="/assets/js/ios-proxy-fix.js?v=2"></script>
  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/languagearts/sj.all.js?v=2025-04-15"></script>
  <script src="/assets/js/sj-tp.js?v=2025-04-15"></script>
  <script src="/assets/js/mg-pxy.js?v=2"></script>
  <script src="/assets/js/m1.js?v=2"></script>
</body>
</html>
